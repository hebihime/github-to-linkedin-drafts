[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-to-linkedin-drafts"
version = "1.0.0"
description = "Turn high-signal GitHub activity into LinkedIn post drafts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "github-to-linkedin-drafts" }]
dependencies = [
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "google-genai>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
github-to-linkedin = "src.main:cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
